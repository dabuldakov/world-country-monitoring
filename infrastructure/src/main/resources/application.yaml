application:
  swaggerApi: ${SWAGGER_API_ACCESS:true}
  scheduling:
    update-all-countries-gdp: "0 0 12 1 * ?"
  refill:
    worker:
      enabled: ${REFILL_WORKER_ENABLED:true}
      delay-ms: ${REFILL_WORKER_DELAY_MS:5000}
  admin:
    login: ${ADMIN_LOGIN:admin}
    password: ${ADMIN_PASSWORD:change-me}
    email: ${ADMIN_EMAIL:dabuldakov@mail.ru}
    token-secret: ${ADMIN_TOKEN_SECRET:change-me-too}
    token-ttl-minutes: ${ADMIN_TOKEN_TTL_MINUTES:720}
  frontend:
    enabled: ${FRONTEND_ONLY_ENABLED:true}
    client-key: ${FRONTEND_CLIENT_KEY:wcm-frontend}
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000,http://country-monitoring.com,https://country-monitoring.com,http://www.country-monitoring.com,https://www.country-monitoring.com,http://countrymonitoring.ru,https://countrymonitoring.ru,http://www.countrymonitoring.ru,https://www.countrymonitoring.ru,http://89.104.66.226,https://89.104.66.226}

spring:
  mail:
    host: ${MAIL_HOST:smtp.mail.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:dabuldakov@mail.ru}
    password: ${MAIL_PASSWORD:change_me}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SSL_ENABLED:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  datasource:
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:postgres}
    url: ${POSTGRES_URL:jdbc:postgresql://0.0.0.0:5432/}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${MAXIMUM_POOL_SIZE_DB:10}
      register-mbeans: true
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: validate
  flyway:
    baseline-on-migrate: true
    clean-disabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never